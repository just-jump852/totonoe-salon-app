<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="整えサロンの予約アプリ。会員登録不要、承認制の予約リクエスト。">
<meta name="theme-color" content="#3F4A3D">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">
<title>整えサロン 予約アプリ</title>
<style>
  .totonoe {
    --ink: #262019;
    --ink-soft: #59503f;
    --paper: #F4EFE3;
    --surface: #FFFDF8;
    --line: #E1D8C2;
    --line-strong: #CFC3A6;
    --moss: #37432D;
    --moss-deep: #212A1B;
    --moss-tint: #E3E7D6;
    --moss-tint-text: #2B3524;
    --brass: #7A5A20;
    --brass-tint: #F3E7C8;
    --pending-bg: #FBEADA;
    --pending-text: #5E3413;
    --cancel-bg: #F6E3DC;
    --cancel-text: #7A3A26;
    --neutral-bg: #EDEAE0;
    --neutral-text: #625A49;
    --tap: 52px;
    --fs-xs: 13px;
    --fs-sm: 15px;
    --fs-base: 17px;
    --fs-md: 19px;
    --fs-lg: 23px;
    --fs-xl: 28px;
    --fs-2xl: 33px;

    color: var(--ink);
    background: var(--paper);
    font-family: 'Zen Kaku Gothic New', 'Yu Gothic', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .totonoe[data-textsize="large"] {
    --tap: 58px;
    --fs-xs: 15px;
    --fs-sm: 18px;
    --fs-base: 20px;
    --fs-md: 23px;
    --fs-lg: 27px;
    --fs-xl: 32px;
    --fs-2xl: 38px;
  }

  .totonoe-shell {
    max-width: 480px;
    margin: 0 auto;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--paper);
    position: relative;
  }

  .screen { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .screen-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .screen-body { padding: 20px 22px 28px; }
  .screen-body.flush { padding: 0 0 28px; }

  .totonoe-loading {
    height: 100vh;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--moss);
  }

  .totonoe h1, .totonoe h2, .totonoe h3, .totonoe p { margin: 0; }
  .eyebrow { font-size: var(--fs-xs); letter-spacing: 0.22em; color: var(--brass); margin: 0 0 8px; font-weight: 500; }
  .serif { font-family: 'Zen Old Mincho', 'Yu Mincho', 'Hiragino Mincho ProN', 'Noto Serif JP', serif; }
  h1.serif { font-size: var(--fs-2xl); color: var(--moss); font-weight: 600; line-height: 1.3; }
  h2.serif { font-size: var(--fs-lg); font-weight: 600; line-height: 1.4; }
  .tagline { font-size: var(--fs-sm); color: var(--ink-soft); margin-top: 8px; line-height: 1.7; }
  .muted { color: var(--ink-soft); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
  .card + .card { margin-top: 12px; }

  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); padding: 6px 14px; border-radius: 999px; font-weight: 600; white-space: nowrap; flex-shrink: 0; }
  .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
  .pill-pending { background: var(--pending-bg); color: var(--pending-text); }
  .pill-confirmed { background: var(--moss-tint); color: var(--moss-tint-text); }
  .pill-cancelled { background: var(--neutral-bg); color: var(--neutral-text); }
  .pill-done { background: var(--neutral-bg); color: var(--neutral-text); }

  .btn { border: none; cursor: pointer; font-family: inherit; font-size: var(--fs-base); border-radius: 999px; min-height: var(--tap); display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 20px; font-weight: 600; transition: transform 0.08s ease; }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.35; cursor: default; }
  .btn-primary { background: var(--moss); color: #fff; width: 100%; }
  .btn-outline { background: var(--surface); border: 1.5px solid var(--line-strong); color: var(--moss); }
  .btn-cancel { background: var(--cancel-bg); color: var(--cancel-text); width: 100%; }
  .btn-text { background: none; border: none; color: var(--brass); font-size: var(--fs-sm); padding: 8px 0; text-decoration: underline; cursor: pointer; font-weight: 500; min-height: 40px; font-family: inherit; }

  .row { display: flex; justify-content: space-between; gap: 12px; font-size: var(--fs-base); line-height: 1.5; }
  .row + .row { margin-top: 10px; }
  .row .k { color: var(--ink-soft); flex-shrink: 0; }
  .row .v { text-align: right; font-weight: 500; }

  .banner { border-radius: 18px; padding: 24px 22px; color: #fff; background: linear-gradient(150deg, var(--moss), var(--moss-deep)); position: relative; overflow: hidden; }
  .banner-leaf { position: absolute; right: -14px; bottom: -14px; width: 110px; height: 110px; opacity: 0.16; }

  .avatar { width: 46px; height: 46px; border-radius: 50%; background: var(--moss); color: #fff; display: flex; align-items: center; justify-content: center; font-size: var(--fs-md); flex-shrink: 0; font-weight: 500; }

  .topbar { flex-shrink: 0; display: flex; align-items: center; justify-content: flex-end; padding: 12px 16px; }
  .textsize-toggle { display: flex; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 999px; padding: 3px; }
  .textsize-toggle button { border: none; background: transparent; padding: 7px 13px; font-size: 12.5px; color: var(--moss); cursor: pointer; font-family: inherit; border-radius: 999px; font-weight: 500; min-height: 36px; }
  .textsize-toggle button.active { background: var(--moss); color: #fff; }
  .textsize-toggle button:first-child { font-size: 11px; }
  .textsize-toggle button:last-child { font-size: 15px; }

  .bottomdock { flex-shrink: 0; display: flex; flex-direction: column; }
  .actionbar { background: var(--surface); border-top: 1px solid var(--line); padding: 14px 22px; }
  .navbar { background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: space-around; padding: 10px 4px 14px; flex-shrink: 0; }
  .navbtn { display: flex; flex-direction: column; align-items: center; gap: 5px; background: none; border: none; cursor: pointer; color: #A69C86; font-family: inherit; min-width: 64px; min-height: 52px; justify-content: center; border-radius: 12px; }
  .navbtn.active { color: var(--moss); }
  .navbtn span { font-size: var(--fs-xs); font-weight: 600; }
  .navicon { width: 25px; height: 25px; }

  .chip { font-size: var(--fs-sm); padding: 10px 16px; min-height: 42px; border-radius: 999px; border: 1.5px solid var(--line-strong); background: var(--surface); color: var(--ink-soft); cursor: pointer; font-family: inherit; white-space: nowrap; font-weight: 500; }
  .chip.active { background: var(--moss); border-color: var(--moss); color: #fff; }

  .menuitem { display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 16px; cursor: pointer; font-family: inherit; }
  .menuitem.sel { border-color: var(--moss); background: var(--moss-tint); }
  .menuitem + .menuitem { margin-top: 10px; }
  .menuitem-check { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--line-strong); flex-shrink: 0; margin-top: 2px; display: flex; align-items: center; justify-content: center; background: var(--surface); }
  .menuitem.sel .menuitem-check { background: var(--moss); border-color: var(--moss); }
  .menuitem-check svg { width: 14px; height: 14px; opacity: 0; }
  .menuitem.sel .menuitem-check svg { opacity: 1; }
  .menuitem-body { flex: 1; min-width: 0; }
  .menuitem-name { font-size: var(--fs-base); font-weight: 500; line-height: 1.5; display: block; }
  .menuitem-meta { font-size: var(--fs-xs); color: var(--ink-soft); margin-top: 4px; display: block; }
  .menuitem-desc { font-size: var(--fs-sm); color: var(--ink-soft); margin-top: 6px; line-height: 1.6; display: block; }
  .menuitem-price { font-size: var(--fs-md); margin-top: 8px; color: var(--ink); font-weight: 600; display: block; }

  .steps { display: flex; gap: 6px; margin: 18px 0 22px; }
  .step { height: 4px; flex: 1; border-radius: 4px; background: var(--line); }
  .step.on { background: var(--moss); }

  .datewrap { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .datecard { min-height: 78px; border-radius: 14px; border: 1.5px solid var(--line-strong); background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; font-family: inherit; color: var(--ink); }
  .datecard .dow { font-size: var(--fs-xs); color: var(--ink-soft); font-weight: 500; }
  .datecard .num { font-size: var(--fs-lg); font-weight: 600; }
  .datecard.sel { background: var(--moss); border-color: var(--moss); }
  .datecard.sel .dow, .datecard.sel .num { color: #fff; }
  .datecard.off { opacity: 0.42; cursor: default; }
  .datecard.off .num { text-decoration: line-through; text-decoration-thickness: 1.5px; }

  .timelist { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .timerow { display: flex; align-items: center; justify-content: space-between; min-height: var(--tap); padding: 0 18px; border-radius: 14px; border: 1.5px solid var(--line-strong); background: var(--surface); cursor: pointer; font-family: inherit; font-size: var(--fs-base); font-weight: 500; color: var(--ink); }
  .timerow.sel { background: var(--moss); border-color: var(--moss); color: #fff; }
  .timerow.off { opacity: 0.5; cursor: default; }
  .timerow .badge { font-size: var(--fs-xs); color: var(--ink-soft); font-weight: 500; }
  .timerow.sel .badge { color: #fff; opacity: 0.85; }
  .timerow.off .badge { color: var(--cancel-text); }

  .field { display: block; margin-bottom: 16px; }
  .field .lbl { font-size: var(--fs-sm); color: var(--ink-soft); display: flex; align-items: center; gap: 8px; margin-bottom: 7px; font-weight: 500; }
  .req { font-size: var(--fs-xs); background: var(--pending-bg); color: var(--pending-text); padding: 2px 9px; border-radius: 5px; font-weight: 600; }
  .opt { font-size: var(--fs-xs); background: var(--moss-tint); color: var(--moss-tint-text); padding: 2px 9px; border-radius: 5px; font-weight: 600; }
  .field input { width: 100%; border: 1.5px solid var(--line-strong); background: var(--surface); border-radius: 12px; padding: 0 15px; min-height: var(--tap); font-size: var(--fs-base); font-family: inherit; color: var(--ink); }
  .field input:focus { outline: 3px solid #37432D33; border-color: var(--moss); }

  .note { font-size: var(--fs-sm); padding: 13px 15px; border-radius: 12px; line-height: 1.65; font-weight: 500; }
  .note-moss { background: var(--moss-tint); color: var(--moss-tint-text); }
  .note-warn { background: var(--pending-bg); color: var(--pending-text); }
  .empty { text-align: center; font-size: var(--fs-sm); color: var(--ink-soft); padding: 20px 0; }

  .notice { background: var(--pending-bg); border-radius: 14px; padding: 14px 16px; margin-bottom: 14px; display: flex; gap: 10px; align-items: flex-start; }
  .notice-icon { flex-shrink: 0; width: 20px; height: 20px; color: var(--pending-text); margin-top: 2px; }
  .notice-body .lbl { font-size: var(--fs-xs); font-weight: 700; color: var(--pending-text); letter-spacing: 0.05em; margin-bottom: 3px; }
  .notice-body .msg { font-size: var(--fs-sm); color: var(--pending-text); line-height: 1.65; white-space: pre-wrap; }

  .histrow { border-bottom: 1px solid var(--line); padding: 14px 0; }
  .histrow:last-child { border-bottom: none; }

  .admin-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .admin-head .links { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  .admin-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 18px 0 6px; }
  .admin-stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 13px 12px; }
  .admin-stat .n { font-size: var(--fs-xl); font-weight: 600; }
  .admin-stat .l { font-size: var(--fs-xs); color: var(--ink-soft); margin-top: 2px; }
  .admin-section-title { font-size: var(--fs-base); font-weight: 600; margin: 24px 0 10px; display: flex; align-items: center; gap: 8px; }
  .admin-row { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .admin-row + .admin-row { margin-top: 8px; }
  .admin-row.pending { border-color: var(--line-strong); }
  .admin-row .when { font-size: var(--fs-base); font-weight: 600; }
  .admin-row .menu { font-size: var(--fs-sm); color: var(--ink-soft); margin-top: 3px; }
  .admin-row .cust { font-size: var(--fs-sm); color: var(--ink-soft); margin-top: 3px; word-break: break-word; }
  .admin-row .cust a { color: var(--moss); }
  .admin-actions { display: flex; gap: 8px; margin-top: 12px; }
  .admin-btn { border: none; border-radius: 999px; padding: 0 16px; min-height: 46px; font-size: var(--fs-sm); font-weight: 600; cursor: pointer; font-family: inherit; white-space: nowrap; flex: 1; display: inline-flex; align-items: center; justify-content: center; }
  .admin-btn-approve { background: var(--moss); color: #fff; }
  .admin-btn-reject { background: var(--cancel-bg); color: var(--cancel-text); }
  .admin-btn-cancel { background: var(--neutral-bg); color: var(--neutral-text); }
  .admin-empty { font-size: var(--fs-sm); color: var(--ink-soft); padding: 10px 2px; }
  .admin-input, .admin-textarea { width: 100%; border: 1.5px solid var(--line-strong); border-radius: 10px; padding: 11px 13px; font-family: inherit; font-size: var(--fs-sm); color: var(--ink); background: var(--surface); }
  .admin-textarea { min-height: 84px; resize: vertical; }
  .admin-fieldlabel { font-size: var(--fs-xs); color: var(--ink-soft); display: block; margin-bottom: 5px; font-weight: 500; }

  .mailcard { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .mailcard-head { background: #EAE5D6; padding: 11px 16px; font-size: var(--fs-xs); color: var(--ink-soft); display: flex; flex-direction: column; gap: 3px; font-weight: 500; }
  .mailcard-body { padding: 16px; }
  .mailcard-subject { font-size: var(--fs-base); font-weight: 600; margin: 0 0 10px; color: var(--ink); }
  .mailcard-line { font-size: var(--fs-sm); color: #45402f; margin: 0 0 6px; line-height: 1.6; }
  .mailcard-hint { font-size: var(--fs-xs); color: var(--ink-soft); line-height: 1.7; margin-top: 8px; }

  .pin-wrap { padding: 56px 26px 0; }

  ::selection { background: #37432D33; }

  @media (prefers-reduced-motion: reduce) {
    .totonoe *, .totonoe *::before, .totonoe *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  }
  /* ==== 埋め込みここまで ==== */

  * { box-sizing: border-box; }
  html, body { margin: 0; background: #F4EFE3; }
  #root { min-height: 100vh; min-height: 100dvh; }
  .animate-spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="root"></div>
<script>
// ============================================================
// 整えサロン 予約アプリ本体
// フレームワーク・ビルド不要。素のHTML/CSS/JavaScriptのみで構成。
// データはこの端末のブラウザ内（localStorage、キーは totonoe:*）に保存される。
// ============================================================

const SALON_NAME = "整えサロン";
const BUSINESS_HOURS = { start: 13, end: 17 };
const CLOSED_WEEKDAYS = [0];
const SLOT_INTERVAL = 30;
const ADMIN_PIN = "0000";

const DEFAULT_SETTINGS = {
  announcement: "",
  contactInfo: {
    phone: "03-0000-0000",
    email: "info@totonoe-salon.example.com",
    instagram: "https://www.instagram.com/totonoe_salon/",
    website: "https://totonoe-salon.example.com",
  },
  textSize: "base",
};

const CATEGORIES = [
  { id: "all", label: "すべて" },
  { id: "first", label: "初回限定" },
  { id: "full", label: "しっかりケア" },
  { id: "part", label: "部位別ケア" },
];

const MENU_ITEMS = [
  { id: "f1", cat: "first", name: "【初回限定】おためし相談＆肩こり改善コース", duration: 60, price: 2000, desc: "肩こりのお悩みを丁寧にヒアリングし、原因を評価します" },
  { id: "f2", cat: "first", name: "【初回限定】おためし相談＆腰痛改善コース", duration: 60, price: 2000, desc: "腰痛のお悩みを丁寧にヒアリングし、原因を評価します" },
  { id: "f3", cat: "first", name: "【初回限定】おためし相談＆その他改善コース", duration: 60, price: 2000, desc: "気になる不調を丁寧にヒアリングし、原因を評価します" },
  { id: "m1", cat: "full", name: "体の不調しっかり改善コース", duration: 60, price: 6000, desc: "全身の状態を評価し、根本原因からしっかり整えます" },
  { id: "m2", cat: "full", name: "全身リラクゼーションコース", duration: 60, price: 6000, desc: "全身の緊張をゆるめ、リラックスへ導きます" },
  { id: "m3", cat: "part", name: "肩こり・痛み軽減コース", duration: 30, price: 3000, desc: "肩まわりの張りとこりに集中的にアプローチ" },
  { id: "m4", cat: "part", name: "腰痛・腰の張り軽減コース", duration: 30, price: 3000, desc: "腰まわりの張りと痛みに集中的にアプローチ" },
  { id: "m5", cat: "part", name: "足の痛み・張り軽減コース", duration: 30, price: 3000, desc: "足のむくみ・張り・痛みに集中的にアプローチ" },
  { id: "m6", cat: "full", name: "パーソナル・リハビリコース", duration: 60, price: 8000, desc: "作業療法士による本格的な評価と個別リハビリ" },
  { id: "m7", cat: "part", name: "その他の整えコース", duration: 30, price: 3000, desc: "気になる部位を自由にお伝えください" },
];

function isBlocking(b) { return b.status === "pending" || b.status === "confirmed"; }

function pad(n) { return String(n).padStart(2, "0"); }
function toDateKey(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function toMinutes(hhmm) { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m; }
function addMinutes(hhmm, mins) { const total = toMinutes(hhmm) + mins; return `${pad(Math.floor(total / 60))}:${pad(total % 60)}`; }
const DOW = ["日", "月", "火", "水", "木", "金", "土"];
function dowJP(d) { return DOW[d.getDay()]; }
function formatDateJP(d) { return `${d.getMonth() + 1}月${d.getDate()}日（${dowJP(d)}）`; }
function daysFromNow(n) { const d = new Date(); d.setDate(d.getDate() + n); d.setHours(0, 0, 0, 0); return d; }
function normPhone(p) { return (p || "").replace(/[^0-9]/g, ""); }
function makeBookingId(dateKey, time) { return `${dateKey.replace(/-/g, "")}-${time.replace(":", "")}-${Math.random().toString(36).slice(2, 6)}`; }
function nowMillis() { return Date.now(); }
function cancelDeadlinePassed(dateKey) { return new Date() >= new Date(`${dateKey}T00:00:00`); }
function isFuture(dateKey) { return dateKey >= toDateKey(new Date()); }
function statusLabel(status) { return { pending: "承認待ち", confirmed: "確定", cancelled: "キャンセル済み" }[status] || status; }
function statusPillClass(status, dateKey) {
  if (status === "cancelled") return "pill-cancelled";
  if (status === "pending") return "pill-pending";
  if (status === "confirmed" && dateKey < toDateKey(new Date())) return "pill-done";
  return "pill-confirmed";
}
function slotReason(menu, dayBookings, d, t) {
  if (!menu) return "closed";
  const today = new Date(); today.setHours(0, 0, 0, 0);
  if (d < today || CLOSED_WEEKDAYS.includes(d.getDay())) return "closed";
  const startMin = toMinutes(t);
  const endMin = startMin + menu.duration;
  if (endMin > BUSINESS_HOURS.end * 60) return "closed";
  const now = new Date();
  if (toDateKey(now) === toDateKey(d) && startMin <= now.getHours() * 60 + now.getMinutes()) return "past";
  for (const b of dayBookings) {
    if (b.status !== "cancelled" && startMin < toMinutes(b.end) && endMin > toMinutes(b.start)) return "taken";
  }
  return null;
}
function isPastOrClosed(d) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  return d < today || CLOSED_WEEKDAYS.includes(d.getDay());
}
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

// ============================================================
// アイコン
// ============================================================
function svg(inner, size) { return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`; }
const IconHome = (s) => svg('<path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1v-9"/>', s);
const IconCalendar = (s) => svg('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>', s);
const IconUser = (s) => svg('<circle cx="12" cy="8" r="3.4"/><path d="M5 20c1.2-3.6 4-5.4 7-5.4s5.8 1.8 7 5.4"/>', s);
const IconPhone = (s) => svg('<path d="M5 4h3l2 5-2.5 1.5a11 11 0 005 5L14 13l5 2v3a2 2 0 01-2 2C10.5 20 4 13.5 4 6a2 2 0 011-2z"/>', s);
const IconChevronLeft = (s) => svg('<path d="M15 6l-6 6 6 6"/>', s);
const IconAlert = (s) => svg('<path d="M10.3 3.9L2.7 17.5c-.5.9.1 2 1.2 2h16.2c1 0 1.7-1.1 1.2-2L13.7 3.9c-.5-.9-1.9-.9-2.4 0z"/><path d="M12 9v4M12 16.5h.01"/>', s);
const IconCheck = (s) => svg('<path d="M5 12l5 5 9-11"/>', s);
const IconShield = (s) => svg('<path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/>', s);
function IconSpinner(size) { return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" class="animate-spin"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-opacity="0.25" stroke-width="3"/><path d="M21 12a9 9 0 00-9-9" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>`; }
const CheckMark = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4 10-10"/></svg>';
const LeafDeco = '<svg class="banner-leaf" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M50 95C50 60 60 30 90 8"/><path d="M50 95C50 55 40 25 12 5"/><path d="M50 70C58 62 66 58 76 56"/><path d="M50 55C57 48 63 45 71 43"/><path d="M50 70C42 62 34 58 24 56"/><path d="M50 55C43 48 37 45 29 43"/></svg>';

// ============================================================
// 状態・永続化（localStorage。本体の window.storage シムと同じキー）
// ============================================================
function readRoute() { return window.location.hash === "#admin" ? "admin" : "app"; }

const S = {
  route: readRoute(),
  tab: "home",
  flowStep: 0,
  menuId: null,
  category: "all",
  date: null,
  time: null,
  dateOffset: 0,
  form: { name: "", phone: "", email: "" },
  bookings: {},
  profile: { name: "", phone: "", email: "" },
  settings: JSON.parse(JSON.stringify(DEFAULT_SETTINGS)),
  saving: false,
  error: "",
  confirmedId: null,
  confirmCancelId: null,
  adminAuthed: false,
  adminNotice: null,
  adminConfirmCancelId: null,
  savedFlash: "",
};

(function loadPersisted() {
  try { const b = localStorage.getItem("totonoe:bookings"); if (b) S.bookings = JSON.parse(b); } catch (e) {}
  try {
    const p = localStorage.getItem("totonoe:profile");
    if (p) { const parsed = JSON.parse(p); S.profile = { name: parsed.name || "", phone: parsed.phone || "", email: parsed.email || "" }; S.form = { ...S.profile }; }
  } catch (e) {}
  try {
    const s = localStorage.getItem("totonoe:settings");
    if (s) {
      const parsed = JSON.parse(s);
      S.settings = {
        announcement: parsed.announcement || "",
        contactInfo: { ...DEFAULT_SETTINGS.contactInfo, ...(parsed.contactInfo || {}) },
        textSize: parsed.textSize === "large" ? "large" : "base",
      };
    }
  } catch (e) {}
  try { if (localStorage.getItem("totonoe:adminAuthed") === "1") S.adminAuthed = true; } catch (e) {}
})();

function saveBookings(next) {
  S.bookings = next;
  try { localStorage.setItem("totonoe:bookings", JSON.stringify(next)); }
  catch (e) { S.error = "保存に失敗しました。もう一度お試しください。"; }
}
function saveProfile(next) {
  S.profile = next;
  try { localStorage.setItem("totonoe:profile", JSON.stringify(next)); } catch (e) {}
}
function saveSettings(next) {
  S.settings = next;
  try { localStorage.setItem("totonoe:settings", JSON.stringify(next)); } catch (e) {}
}
function setBookingStatus(id, status) {
  const next = {};
  for (const [key, list] of Object.entries(S.bookings)) next[key] = list.map((b) => (b.id === id ? { ...b, status } : b));
  saveBookings(next);
}
function allBookingsFlat() { return Object.values(S.bookings).flat(); }
function menu() { return MENU_ITEMS.find((m) => m.id === S.menuId); }
function isReturning() { return !!(S.profile.name && S.profile.phone); }

function myHistory() {
  const mine = normPhone(S.profile.phone);
  if (!mine) return [];
  return allBookingsFlat().filter((b) => normPhone(b.phone) === mine).sort((a, b) => (a.dateKey + a.start).localeCompare(b.dateKey + b.start));
}
function nextBookingFn() {
  const todayKey = toDateKey(new Date());
  return myHistory().find((b) => b.dateKey >= todayKey && b.status !== "cancelled") || null;
}
function lastVisitFn() {
  const todayKey = toDateKey(new Date());
  const past = myHistory().filter((b) => b.status !== "cancelled" && b.dateKey < todayKey);
  return past.length ? past[past.length - 1] : null;
}

// ============================================================
// アクション
// ============================================================
function startFlow(presetMenuId) {
  S.menuId = presetMenuId || null;
  S.date = null; S.time = null; S.error = ""; S.confirmedId = null;
  S.flowStep = presetMenuId ? 1 : 0;
  S.tab = "book";
  render();
}
function changeTab(t) {
  if (t === "book" && !S.confirmedId) { S.flowStep = 0; S.menuId = null; S.date = null; S.time = null; S.error = ""; }
  S.tab = t;
  render();
}
function selectDate(iso) {
  S.date = new Date(iso); S.time = null;
  render();
  setTimeout(() => { const el = document.getElementById("time-heading"); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }, 60);
}
function shiftDate(delta) { S.dateOffset = Math.max(0, S.dateOffset + delta * 12); render(); }
function selectMenu(id) { S.menuId = id; render(); }
function selectCategory(c) { S.category = c; render(); }
function selectTime(t) { S.time = t; render(); }
function setTextSize(v) { saveSettings({ ...S.settings, textSize: v }); render(); }

function canNext() {
  if (S.flowStep === 0) return !!S.menuId;
  if (S.flowStep === 1) return !!(S.date && S.time);
  if (S.flowStep === 2) return !!(S.form.name.trim() && S.form.phone.trim());
  return true;
}
function goNext() {
  if (S.flowStep === 1 && isReturning()) {
    S.form = { name: S.profile.name, phone: S.profile.phone, email: S.profile.email || "" };
    S.flowStep = 3; render(); return;
  }
  S.flowStep++; render();
}
function goBack() { S.flowStep--; render(); }
function editInfo() { S.flowStep = 2; render(); }
function updateForm(field, val) { S.form[field] = val; }

function submitRequest() {
  const mn = menu();
  if (!mn || !S.date || !S.time) return;
  S.saving = true; S.error = ""; render();
  const key = toDateKey(S.date);
  const end = addMinutes(S.time, mn.duration);
  const dayList = S.bookings[key] || [];
  const overlap = dayList.some((b) => isBlocking(b) && toMinutes(S.time) < toMinutes(b.end) && toMinutes(end) > toMinutes(b.start));
  if (overlap) {
    S.error = "申し訳ありません。この時間は直前に埋まりました。別の時間をお選びください。";
    S.saving = false; S.time = null; S.flowStep = 1; render(); return;
  }
  const entry = {
    id: makeBookingId(key, S.time), dateKey: key, start: S.time, end,
    name: S.form.name.trim(), phone: S.form.phone.trim(), email: S.form.email.trim(),
    menuName: mn.name, price: mn.price, createdAt: nowMillis(), status: "pending",
  };
  saveBookings({ ...S.bookings, [key]: [...dayList, entry] });
  saveProfile({ name: entry.name, phone: entry.phone, email: entry.email });
  S.confirmedId = entry.id;
  S.saving = false;
  render();
}
function resetFlow() { S.flowStep = 0; S.menuId = null; S.date = null; S.time = null; S.confirmedId = null; S.error = ""; S.tab = "home"; render(); }
function askCancelBooking(id) { S.confirmCancelId = id; render(); }
function cancelCancelBooking() { S.confirmCancelId = null; render(); }
function cancelBooking(id) { setBookingStatus(id, "cancelled"); S.confirmCancelId = null; render(); }

// ---- 管理画面のアクション ----
function noticeFor(id, status) { const b = allBookingsFlat().find((x) => x.id === id); return b ? { ...b, status } : null; }
function adminApprove(id) { S.adminNotice = { type: "approved", booking: noticeFor(id, "confirmed") }; setBookingStatus(id, "confirmed"); render(); }
function adminReject(id) { S.adminNotice = { type: "rejected", booking: noticeFor(id, "cancelled") }; setBookingStatus(id, "cancelled"); render(); }
function askAdminCancel(id) { S.adminConfirmCancelId = id; render(); }
function cancelAdminCancel() { S.adminConfirmCancelId = null; render(); }
function adminCancelConfirmed(id) { setBookingStatus(id, "cancelled"); S.adminConfirmCancelId = null; render(); }
function dismissNotice() { S.adminNotice = null; render(); }

function goAdmin() { window.location.hash = "#admin"; S.route = "admin"; render(); }
function leaveAdmin() { window.location.hash = ""; S.route = "app"; render(); }
window.addEventListener("hashchange", () => { S.route = readRoute(); render(); });

function doAdminLoginFromInput() {
  const el = document.getElementById("pin-input");
  const pin = el ? el.value.trim() : "";
  if (pin !== ADMIN_PIN) {
    const err = document.getElementById("pin-error"); if (err) err.style.display = "block";
    if (el) { el.style.borderColor = "#E3B08C"; el.focus(); }
    return;
  }
  S.adminAuthed = true;
  try { localStorage.setItem("totonoe:adminAuthed", "1"); } catch (e) {}
  render();
}
function adminLogout() {
  S.adminAuthed = false; S.adminNotice = null;
  try { localStorage.removeItem("totonoe:adminAuthed"); } catch (e) {}
  render();
}
function flash(msg) { S.savedFlash = msg; render(); setTimeout(() => { S.savedFlash = ""; render(); }, 2000); }
function adminSaveAnnouncement() {
  const el = document.getElementById("announcement-input");
  saveSettings({ ...S.settings, announcement: el ? el.value : S.settings.announcement });
  flash("お知らせを更新しました");
}
function adminClearAnnouncement() { saveSettings({ ...S.settings, announcement: "" }); flash("お知らせを消しました"); }
function adminSaveContact() {
  const ci = { ...S.settings.contactInfo };
  ["phone", "email", "instagram", "website"].forEach((k) => { const el = document.getElementById("contact-" + k); if (el) ci[k] = el.value; });
  saveSettings({ ...S.settings, contactInfo: ci });
  flash("連絡先を更新しました");
}

function textSizeToggleHtml() {
  const v = S.settings.textSize === "large" ? "large" : "base";
  return `<div class="topbar"><div class="textsize-toggle" role="group" aria-label="文字サイズ">
    <button class="${v === "base" ? "active" : ""}" onclick="setTextSize('base')" aria-pressed="${v === "base"}">文字 標準</button>
    <button class="${v === "large" ? "active" : ""}" onclick="setTextSize('large')" aria-pressed="${v === "large"}">文字 大</button>
  </div></div>`;
}

  const nb = nextBookingFn();

  const lastMenu = lastVisit ? MENU_ITEMS.find((m) => m.name === lastVisit.menuName) : null;
  let h = '<div class="screen-body">';
  if (S.settings.announcement.trim()) {
    h += `<div class="notice"><span class="notice-icon">${IconAlert(20)}</span><div class="notice-body"><p class="lbl">お知らせ</p><p class="msg">${esc(S.settings.announcement)}</p></div></div>`;
  }
  h += '<p class="eyebrow">WELCOME</p>';
  h += `<h1 class="serif">${esc(SALON_NAME)}</h1>`;
  h += '<p class="tagline">作業療法士が、根本から丁寧に整えます。</p>';
  h += `<div class="card" style="display:flex;align-items:center;gap:13px;margin-top:18px;"><div class="avatar">${S.profile.name ? esc(S.profile.name[0]) : IconUser(20)}</div><p style="font-size:var(--fs-base);font-weight:500;">こんにちは、${S.profile.name ? esc(S.profile.name) + "様" : "ゲスト様"}</p></div>`;

    h += `<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;"><p style="font-size:var(--fs-base);line-height:1.6;font-weight:500;">${nb.dateKey.replace(/-/g, "/")} ${nb.start} 〜<br>${esc(nb.menuName)}</p><span class="pill ${statusPillClass(nb.status, nb.dateKey)}">${statusLabel(nb.status)}</span></div>`;
    h += `<button class="btn btn-outline" style="margin-top:14px;width:100%;" onclick="changeTab('mypage')">詳しく見る</button></div>`;

  } else {
    h += `<p class="eyebrow" style="color:#fff;opacity:0.8;">はじめての方に</p><p class="serif" style="font-size:var(--fs-xl);line-height:1.4;color:#fff;">おためし相談<br>コース</p><p style="font-size:var(--fs-sm);opacity:0.9;margin-top:8px;">60分 ／ ¥2,000</p><button class="btn" style="margin-top:16px;background:#fff;color:var(--moss-deep);" onclick="startFlow('f1')">ご予約はこちら</button>`;
  }
  h += `</div>`;
  h += `<button class="card" style="width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;cursor:pointer;margin-top:12px;font-family:inherit;min-height:var(--tap);" onclick="changeTab('mypage')"><span style="font-size:var(--fs-base);font-weight:500;">ご来店履歴を見る</span><span class="muted" style="font-size:20px;">›</span></button>`;

function screenBook() {
  if (S.confirmedId) {
    const mn = menu();
    let h = '<div class="screen-body"><div class="card" style="text-align:center;padding:30px 18px;margin-top:4px;">';
    h += `<div style="width:52px;height:52px;border-radius:50%;background:var(--pending-bg);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:var(--pending-text);">${IconCheck(24)}</div>`;
    h += '<h2 class="serif">予約リクエストを送信しました</h2><p class="pill pill-pending" style="margin:12px 0 18px;">承認待ち</p>';
    h += '<div class="card" style="text-align:left;">';
    h += `<div class="row"><span class="k">メニュー</span><span class="v">${esc(mn && mn.name)}</span></div>`;
    h += `<div class="row"><span class="k">日時</span><span class="v">${S.date ? formatDateJP(S.date) : ""} ${S.time || ""}〜${S.time && mn ? addMinutes(S.time, mn.duration) : ""}</span></div>`;
    h += `<div class="row"><span class="k">お名前</span><span class="v">${esc(S.form.name)}様</span></div>`;
    h += `<div class="row"><span class="k">料金</span><span class="v">¥${mn ? mn.price.toLocaleString() : ""}</span></div></div>`;
    if (S.form.email) h += '<p class="note note-moss" style="margin-top:14px;text-align:left;">サロンの確認後、確定のご連絡をメールでお送りします。</p>';
    else h += '<p class="note note-warn" style="margin-top:14px;text-align:left;">メールアドレスのご登録がないため、確定のご連絡はお電話にて行います。</p>';
    h += '<button class="btn btn-primary" style="margin-top:16px;" onclick="resetFlow()">ホームに戻る</button></div></div>';
    return h;
  }

  const labels = ["メニューを選ぶ", "日時を選ぶ", "お客様情報", "内容の確認"];
  let h = '<div class="screen-body">';
  h += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">';
  if (S.flowStep > 0) h += `<button onclick="goBack()" aria-label="戻る" style="background:none;border:none;padding:0;color:var(--ink-soft);cursor:pointer;min-height:36px;width:36px;display:flex;align-items:center;">${IconChevronLeft(24)}</button>`;
  h += `<p class="eyebrow" style="margin:0;">STEP ${S.flowStep + 1} / 4</p></div>`;
  h += `<h2 class="serif" style="margin-bottom:16px;">${labels[S.flowStep]}</h2>`;
  h += '<div class="steps">';
  for (let i = 0; i < 4; i++) h += `<div class="step ${i <= S.flowStep ? "on" : ""}"></div>`;
  h += "</div>";
  if (S.error) h += `<p class="note note-warn" style="margin-bottom:14px;">${esc(S.error)}</p>`;

  if (S.flowStep === 0) {
    h += '<div style="display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px;">';
    CATEGORIES.forEach((c) => { h += `<button class="chip ${S.category === c.id ? "active" : ""}" onclick="selectCategory('${c.id}')">${c.label}</button>`; });
    h += "</div>";
    const list = S.category === "all" ? MENU_ITEMS : MENU_ITEMS.filter((m) => m.cat === S.category);
    list.forEach((m) => {
      h += `<button class="menuitem ${S.menuId === m.id ? "sel" : ""}" onclick="selectMenu('${m.id}')" aria-pressed="${S.menuId === m.id}">`;
      h += `<span class="menuitem-check">${CheckMark}</span><span class="menuitem-body">`;
      h += `<span class="menuitem-name">${esc(m.name)}</span><span class="menuitem-meta">所要時間　${m.duration}分</span>`;
      h += `<span class="menuitem-desc">${esc(m.desc)}</span><span class="menuitem-price">¥${m.price.toLocaleString()}</span></span></button>`;
    });
  }

  if (S.flowStep === 1) {
    if (!S.menuId) { h += '<p class="note note-warn">先にメニューを選んでください。</p>'; }
    else {
      const mn = menu();
      const dateCards = Array.from({ length: 12 }, (_, i) => daysFromNow(S.dateOffset + i));
      h += '<p style="font-size:var(--fs-base);font-weight:600;margin-bottom:10px;">日付を選ぶ</p><div class="datewrap">';
      dateCards.forEach((d) => {
        const off = isPastOrClosed(d);
        const sel = S.date && toDateKey(S.date) === toDateKey(d);
        h += `<button class="datecard${sel ? " sel" : ""}${off ? " off" : ""}" ${off ? "disabled" : `onclick="selectDate('${d.toISOString()}')"`}>`;
        h += `<span class="dow">${dowJP(d)}</span><span class="num">${d.getDate()}</span>`;
        if (off) h += `<span class="dow">${CLOSED_WEEKDAYS.includes(d.getDay()) ? "定休日" : "—"}</span>`;
        h += "</button>";
      });
      h += "</div>";
      h += `<div style="display:flex;justify-content:space-between;margin-top:12px;"><button class="btn btn-outline" style="padding:0 16px;min-height:44px;font-size:var(--fs-sm);" ${S.dateOffset === 0 ? "disabled" : ""} onclick="shiftDate(-1)">‹ 直近の日程</button><button class="btn btn-outline" style="padding:0 16px;min-height:44px;font-size:var(--fs-sm);" onclick="shiftDate(1)">さらに先の日程 ›</button></div>`;
      if (S.date) {
        h += `<p id="time-heading" style="scroll-margin-top:12px;font-size:var(--fs-base);font-weight:600;margin-top:24px;margin-bottom:10px;">時間を選ぶ　${formatDateJP(S.date)}</p><div class="timelist">`;
        const rows = [];
        for (let m = BUSINESS_HOURS.start * 60; m <= BUSINESS_HOURS.end * 60 - SLOT_INTERVAL; m += SLOT_INTERVAL) rows.push(`${pad(Math.floor(m / 60))}:${pad(m % 60)}`);
        rows.forEach((t) => {
          const reason = slotReason(mn, S.bookings[toDateKey(S.date)] || [], S.date, t);
          const avail = reason === null;
          const sel = S.time === t;
          const label = sel ? "選択中" : avail ? "予約できます" : reason === "taken" ? "予約済み" : reason === "past" ? "受付終了" : "対象外";
          h += `<button class="timerow${sel ? " sel" : ""}${!avail ? " off" : ""}" ${avail ? `onclick="selectTime('${t}')"` : "disabled"}><span>${t} 〜 ${addMinutes(t, mn.duration)}</span><span class="badge">${label}</span></button>`;
        });
        h += "</div>";
      }
    }
  }

  if (S.flowStep === 2) {
    h += "<div>";
    if (isReturning()) h += '<p class="note note-moss" style="margin-bottom:16px;">前回のご来店情報を自動で入力しています。変更があれば書き換えてください。</p>';
    h += `<label class="field"><span class="lbl">お名前 <span class="req">必須</span></span><input value="${esc(S.form.name)}" placeholder="山田 太郎" oninput="updateForm('name',this.value)"></label>`;
    h += `<label class="field"><span class="lbl">電話番号 <span class="req">必須</span></span><input value="${esc(S.form.phone)}" placeholder="090-1234-5678" inputmode="tel" oninput="updateForm('phone',this.value)"></label>`;
    h += `<label class="field"><span class="lbl">メールアドレス <span class="opt">任意</span></span><input value="${esc(S.form.email)}" placeholder="example@mail.com" inputmode="email" oninput="updateForm('email',this.value)"></label>`;
    h += "</div>";
  }

  if (S.flowStep === 3) {
    const mn = menu();
    h += '<div class="card">';
    h += `<div class="row"><span class="k">メニュー</span><span class="v">${esc(mn && mn.name)}</span></div>`;
    h += `<div class="row"><span class="k">日時</span><span class="v">${S.date ? formatDateJP(S.date) : ""} ${S.time || ""}〜${S.time && mn ? addMinutes(S.time, mn.duration) : ""}</span></div>`;
    h += `<div class="row"><span class="k">お名前</span><span class="v">${esc(S.form.name)}様</span></div>`;
    h += `<div class="row" style="border-top:1px solid var(--line);padding-top:10px;margin-top:10px;"><span class="k">料金</span><span class="v">¥${mn ? mn.price.toLocaleString() : ""}</span></div></div>`;
    h += '<p class="note note-warn" style="margin-top:14px;">この時点ではまだ確定ではありません。サロン側で内容を確認のうえ承認いたします。</p>';
    if (isReturning()) h += '<button class="btn-text" onclick="editInfo()">お客様情報を変更する</button>';
  }

  h += "</div>";
  return h;
}

function screenMypage() {
  let h = '<div class="screen-body flush">';
  h += `<div class="banner" style="border-radius:0;padding:22px 22px 30px;">${LeafDeco}`;
  h += '<p class="eyebrow" style="color:#fff;opacity:0.75;">マイページ</p>';
  h += `<div style="display:flex;align-items:center;gap:12px;margin-top:4px;"><div style="width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.18);display:flex;align-items:center;justify-content:center;font-size:var(--fs-md);color:#fff;">${S.profile.name ? esc(S.profile.name[0]) : IconUser(20)}</div>`;
  h += `<p style="font-size:var(--fs-md);color:#fff;font-weight:500;">${S.profile.name ? esc(S.profile.name) + " 様" : "ゲスト様"}</p></div></div>`;
  h += '<div style="padding:0 22px;margin-top:-16px;padding-bottom:26px;"><div class="card"><p style="font-size:var(--fs-base);font-weight:600;margin-bottom:6px;">ご来店履歴</p>';
  const hist = myHistory().slice().reverse();
  if (hist.length === 0) { h += '<p class="empty">まだ来店履歴がありません</p>'; }
  else {
    hist.forEach((b) => {
      const future = isFuture(b.dateKey);
      const active = b.status === "pending" || b.status === "confirmed";
      const cancellable = future && active && !cancelDeadlinePassed(b.dateKey);
      h += '<div class="histrow">';
      h += `<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;"><div><p style="font-size:var(--fs-base);font-weight:500;">${b.dateKey.replace(/-/g, "/")} ${b.start}</p><p class="muted" style="font-size:var(--fs-sm);margin-top:4px;">${esc(b.menuName)}　¥${b.price.toLocaleString()}</p></div><span class="pill ${statusPillClass(b.status, b.dateKey)}">${statusLabel(b.status)}</span></div>`;
      if (future && active) {
        if (cancellable) {
          if (S.confirmCancelId === b.id) {
            h += `<div style="margin-top:12px;"><p class="muted" style="font-size:var(--fs-sm);margin-bottom:8px;">この予約をキャンセルします。よろしいですか？</p><div style="display:flex;gap:8px;"><button class="btn btn-cancel" onclick="cancelBooking('${b.id}')">キャンセルする</button><button class="btn btn-outline" onclick="cancelCancelBooking()">やめる</button></div></div>`;
          } else {
            h += `<button class="btn btn-cancel" style="margin-top:12px;" onclick="askCancelBooking('${b.id}')">この予約をキャンセルする</button>`;
          }
        } else {
          h += '<p class="muted" style="font-size:var(--fs-xs);margin-top:12px;line-height:1.6;">キャンセル期限（前日24:00）を過ぎています。ご変更はお電話にてご連絡ください</p>';
        }
      }
      h += "</div>";
    });
  }
  h += '</div><p class="muted" style="font-size:var(--fs-xs);margin:10px 2px 0;line-height:1.6;">予約内容（日時・メニュー）のご変更は、お電話にてサロンへご連絡ください。</p></div>';
  return h;
}

function appShellHtml() {
  let body;
  if (S.tab === "home") body = screenHome();
  else if (S.tab === "contact") body = screenContact();
  else if (S.tab === "book") body = screenBook();
  else body = screenMypage();

  const nav = [["home", "ホーム", IconHome], ["book", "予約", IconCalendar], ["mypage", "マイページ", IconUser], ["contact", "お問合せ", IconPhone]]
    .map(([id, label, Icon]) => `<button class="navbtn ${S.tab === id ? "active" : ""}" onclick="changeTab('${id}')">${Icon(25)}<span>${label}</span></button>`).join("");

  let dock = '<div class="bottomdock">';
  if (S.tab === "book" && !S.confirmedId) {
    dock += '<div class="actionbar">';
    if (S.flowStep < 3) dock += `<button class="btn btn-primary" ${canNext() ? "" : "disabled"} onclick="goNext()">次へ</button>`;
    else dock += `<button class="btn btn-primary" ${S.saving ? "disabled" : ""} onclick="submitRequest()">${S.saving ? IconSpinner(18) : ""}予約リクエストを送信</button>`;
    dock += "</div>";
  }
  dock += `<div class="navbar">${nav}</div></div>`;

  return `<div class="totonoe-shell"><div class="screen"><div class="screen-scroll">${textSizeToggleHtml()}${body}</div>${dock}</div></div>`;
}

function notificationPreviewHtml(notice) {
  const b = notice.booking;
  const approved = notice.type === "approved";
  if (b.email) {
    let h = `<div class="mailcard"><div class="mailcard-head"><span>通知メール（本番で自動送信される内容）</span><span>宛先: ${esc(b.name || "お客様")} 様</span></div><div class="mailcard-body">`;
    if (approved) {
      h += `<p class="mailcard-subject">【整えサロン】ご予約が確定しました</p><p class="mailcard-line">${esc(b.name)} 様</p><p class="mailcard-line">以下の内容でご予約が確定しましたのでご連絡いたします。</p><p class="mailcard-line">日時：${b.dateKey.replace(/-/g, "/")} ${b.start}〜${b.end}</p><p class="mailcard-line">メニュー：${esc(b.menuName)}（¥${b.price.toLocaleString()}）</p><p class="pill pill-confirmed" style="margin-top:10px;">確定</p>`;
    } else {
      h += `<p class="mailcard-subject">【整えサロン】ご予約についてのご連絡</p><p class="mailcard-line">${esc(b.name)} 様</p><p class="mailcard-line">大変申し訳ございませんが、下記のご希望日時でのご予約をお受けすることができませんでした。</p><p class="mailcard-line">日時：${b.dateKey.replace(/-/g, "/")} ${b.start}〜${b.end}</p><p class="mailcard-line">メニュー：${esc(b.menuName)}</p><p class="mailcard-line">お手数ですが、別の日時にて再度ご予約をお願いいたします。</p><p class="pill pill-cancelled" style="margin-top:10px;">お受けできませんでした</p>`;
    }
    h += "</div></div>";
    h += `<p class="mailcard-hint">${approved ? "承認と同時に、お客様へ確定のご連絡メールが自動送信される想定です（本番の Resend で実装）。" : "却下と同時に、お客様へその旨をお伝えするメールが自動送信される想定です（「却下」の語は文面では使いません）。"}</p>`;
    return h;
  }
  return `<div class="mailcard"><div class="mailcard-head"><span>ご連絡方法</span><span>${esc(b.name || "お客様")} 様</span></div><div class="mailcard-body"><p class="mailcard-line">メールアドレスのご登録がないため、メールでの自動通知はできません。</p><p class="mailcard-line">電話（${esc(b.phone || "未登録")}）にて、${approved ? "確定" : "お受けできない旨"}をご連絡ください。</p></div></div><p class="mailcard-hint">メールアドレス未登録のお客様への通知手段は、要件書8章のとおりまだ確定していません。</p>`;
}

function adminRowHtml(b, actionsHtml) {
  let h = `<div class="admin-row${b.status === "pending" ? " pending" : ""}">`;
  h += `<p class="when">${b.dateKey.replace(/-/g, "/")}（${dowJP(new Date(b.dateKey + "T00:00:00"))}） ${b.start}〜${b.end}</p>`;
  h += `<p class="menu">${esc(b.menuName)}　¥${b.price.toLocaleString()}</p>`;
  h += `<p class="cust">${esc(b.name || "—")} 様　<a href="tel:${normPhone(b.phone)}">${esc(b.phone)}</a>`;
  if (b.email) h += ` 　<a href="mailto:${esc(b.email)}">${esc(b.email)}</a>`;
  h += "</p>";
  h += actionsHtml || "";
  h += "</div>";
  return h;
}

function adminShellHtml() {
  if (!S.adminAuthed) {
    return `<div class="totonoe-shell"><div class="screen-scroll"><div class="pin-wrap">
      <span style="color:var(--moss);">${IconShield(28)}</span>
      <p class="eyebrow">SALON ADMIN</p>
      <h2 class="serif" style="margin-bottom:6px;">サロン管理画面</h2>
      <p class="muted" style="font-size:var(--fs-sm);margin-bottom:20px;">パスコードを入力してください</p>
      <label class="field"><input id="pin-input" type="password" inputmode="numeric" placeholder="パスコード" style="letter-spacing:0.3em;" onkeydown="if(event.key==='Enter')doAdminLoginFromInput()"></label>
      <p id="pin-error" style="display:none;font-size:var(--fs-sm);color:var(--cancel-text);margin:-8px 0 12px;">パスコードが違います</p>
      <button class="btn btn-primary" onclick="doAdminLoginFromInput()">ログイン</button>
      <p class="note note-moss" style="margin-top:16px;">本番公開時は、この画面に必ずログイン保護を設けます（要件書7章）。現在は暫定のパスコード方式です。</p>
      <button class="btn-text" style="margin-top:14px;color:var(--ink-soft);display:block;" onclick="leaveAdmin()">予約アプリに戻る</button>
    </div></div></div>`;
  }

  const all = allBookingsFlat();
  const todayKey = toDateKey(new Date());
  const asc = (a, b) => (a.dateKey + a.start).localeCompare(b.dateKey + b.start);
  const pending = all.filter((b) => b.status === "pending").sort(asc);
  const upcoming = all.filter((b) => b.status === "confirmed" && b.dateKey >= todayKey).sort(asc);
  const past = all.filter((b) => b.status === "cancelled" || (b.status === "confirmed" && b.dateKey < todayKey)).sort((a, b) => asc(b, a)).slice(0, 6);
  const todayCount = all.filter((b) => b.dateKey === todayKey && b.status !== "cancelled").length;
  const ci = S.settings.contactInfo;

  let h = '<div class="screen-scroll"><div class="screen-body">';
  h += '<div class="admin-head"><div><p class="eyebrow">SALON ADMIN</p><h2 class="serif">予約リクエスト管理</h2></div>';
  h += '<div class="links"><button class="btn-text" style="font-size:var(--fs-xs);color:var(--ink-soft);" onclick="leaveAdmin()">アプリ表示</button><button class="btn-text" style="font-size:var(--fs-xs);color:var(--ink-soft);" onclick="adminLogout()">ログアウト</button></div></div>';
  h += '<p class="muted" style="font-size:var(--fs-sm);margin-top:6px;line-height:1.6;">承認・却下、確定予約の取り消しができます。この一覧で埋まっている時間は、お客様側では自動的に選べなくなります。</p>';
  h += `<div class="admin-stats"><div class="admin-stat"><div class="n">${pending.length}</div><div class="l">承認待ち</div></div><div class="admin-stat"><div class="n">${upcoming.length}</div><div class="l">確定（今後）</div></div><div class="admin-stat"><div class="n">${todayCount}</div><div class="l">本日のご来店</div></div></div>`;

  if (S.savedFlash) h += `<p class="note note-moss" style="margin-top:12px;">${esc(S.savedFlash)}</p>`;

  if (S.adminNotice && S.adminNotice.booking) {
    h += `<div style="margin-top:14px;">${notificationPreviewHtml(S.adminNotice)}<button class="btn-text" style="color:var(--ink-soft);" onclick="dismissNotice()">閉じる</button></div>`;
  }

  h += '<div class="admin-section-title">お知らせ編集（ホーム画面の上部に表示）</div>';
  h += `<div class="admin-row"><textarea id="announcement-input" class="admin-textarea" placeholder="例：8月13日（木）は臨時休業とさせていただきます">${esc(S.settings.announcement)}</textarea>`;
  h += `<div class="admin-actions"><button class="admin-btn admin-btn-approve" onclick="adminSaveAnnouncement()">更新する</button><button class="admin-btn admin-btn-cancel" onclick="adminClearAnnouncement()">お知らせを消す</button></div></div>`;

  h += '<div class="admin-section-title">承認待ちの予約リクエスト</div>';
  h += pending.length ? pending.map((b) => adminRowHtml(b, `<div class="admin-actions"><button class="admin-btn admin-btn-approve" onclick="adminApprove('${b.id}')">承認</button><button class="admin-btn admin-btn-reject" onclick="adminReject('${b.id}')">却下</button></div>`)).join("") : '<p class="admin-empty">現在、承認待ちのリクエストはありません。</p>';

  h += '<div class="admin-section-title">確定済みの予約（今後）</div>';
  h += upcoming.length ? upcoming.map((b) => adminRowHtml(b, S.adminConfirmCancelId === b.id
    ? `<div class="admin-actions"><button class="admin-btn admin-btn-reject" onclick="adminCancelConfirmed('${b.id}')">取り消す</button><button class="admin-btn admin-btn-cancel" onclick="cancelAdminCancel()">やめる</button></div>`
    : `<div class="admin-actions"><button class="admin-btn admin-btn-cancel" onclick="askAdminCancel('${b.id}')">この予約を取り消す</button></div>`)).join("") : '<p class="admin-empty">今後の確定予約はありません。</p>';

  h += '<div class="admin-section-title">過去・キャンセル済み</div>';
  h += past.length ? past.map((b) => adminRowHtml(b, `<div style="margin-top:10px;"><span class="pill ${statusPillClass(b.status, b.dateKey)}">${statusLabel(b.status)}</span></div>`)).join("") : '<p class="admin-empty">履歴はまだありません。</p>';

  h += '<div class="admin-section-title">連絡先・SNSリンクの編集</div><p class="muted" style="font-size:var(--fs-xs);margin:-4px 0 10px;">頻繁に変更するものではないため、一番下にまとめています</p><div class="admin-row">';
  [["phone", "電話番号"], ["email", "メールアドレス"], ["instagram", "Instagram URL"], ["website", "ホームページ URL"]].forEach(([key, label]) => {
    h += `<label style="display:block;margin-bottom:10px;"><span class="admin-fieldlabel">${label}</span><input id="contact-${key}" class="admin-input" value="${esc(ci[key] || "")}"></label>`;
  });
  h += '<div class="admin-actions"><button class="admin-btn admin-btn-approve" onclick="adminSaveContact()">連絡先を更新する</button></div></div>';

  h += '<p class="muted" style="font-size:var(--fs-xs);line-height:1.7;margin-top:20px;">※このプロトタイプでは予約データはこの端末のブラウザ内（localStorage）にのみ保存され、他の端末とは同期しません。本番公開時は Supabase 等のデータベースに置き換える想定です（要件書7章）。</p>';
  h += "</div></div>";
  return `<div class="totonoe-shell">${h}</div>`;
}

let prevScrollKey = null;
function render() {
  const prevEl = document.querySelector(".screen-scroll");
  const savedScroll = prevEl ? prevEl.scrollTop : 0;
  const key = S.tab + "|" + S.flowStep + "|" + S.confirmedId + "|" + S.route;
  const keep = key === prevScrollKey;
  prevScrollKey = key;

  const textSize = S.settings.textSize === "large" ? "large" : "base";
  const root = document.getElementById("root");
  root.innerHTML = `<div class="totonoe" data-textsize="${textSize}">${S.route === "admin" ? adminShellHtml() : appShellHtml()}</div>`;

  if (keep) { const el = document.querySelector(".screen-scroll"); if (el) el.scrollTop = savedScroll; }
}

render();

// PWA: ホーム画面に追加できるようにするための最小限のService Worker登録
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => { /* オフライン対応は必須ではないため失敗しても無視 */ });
  });
}
</script>
</body>
</html>
